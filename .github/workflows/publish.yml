name: Build and Validate

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install numpy

      - name: Run basic tests
        run: |
          python -c "from thermal_substrate import ThermalSubstrate; print('Import successful')"
          python - <<'PY'
from thermal_substrate import ThermalSubstrate
import tempfile
import os

with tempfile.NamedTemporaryFile(delete=False) as f:
    db_path = f.name

try:
    tcs = ThermalSubstrate(db_path)
    tcs.register_entity('test_entity', 'test', initial_temp=300)
    result = tcs.execute_with_coupling('test_op', 'test_entity')
    assert result is not None
    assert 'phase_coefficient' in result or 'phase' in result
    print('Basic functionality test passed')
finally:
    os.unlink(db_path)
PY

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

